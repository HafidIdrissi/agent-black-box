name: Bug report
description: Report a reproducible problem using synthetic data.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include your OS, Node/browser version, and repository commit.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use invented logs. Never attach private sessions or secrets.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal synthetic example
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: I checked that this report contains no private logs, secrets, or personal information.
          required: true
